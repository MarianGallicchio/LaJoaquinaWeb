      "description": "Tienda online de mascotas: alimentos balanceados, piedras sanitarias y accesorios, con envíos a todo el país.",

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      // Suprimir errores de WebSocket benignos de Vite en entorno iframe sandbox
      window.addEventListener('unhandledrejection', function(event) {
        var r = event.reason;
        var msg = (r && (r.message || (typeof r === 'string' ? r : ''))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || (r && r.stack && r.stack.indexOf('vite') !== -1)) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
