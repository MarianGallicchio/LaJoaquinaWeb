<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Joaquina · Panel Administrador — Gestión de Tienda, Stock y Envíos</title>
    <meta name="description" content="Panel privado de administración de La Joaquina Pet Shop: productos, stock, ventas, envíos y configuración del comercio." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suprimir errores de WebSocket benignos de Vite en entorno iframe sandbox
      window.addEventListener('unhandledrejection', function(event) {
        var r = event.reason;
        var msg = (r && (r.message || (typeof r === 'string' ? r : ''))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || (r && r.stack && r.stack.indexOf('vite') !== -1)) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
  </head>
  <body class="bg-[#FAF7F2] text-[#2B231D] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/admin-main.tsx"></script>
  </body>
</html>
